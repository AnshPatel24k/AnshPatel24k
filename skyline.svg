<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Gotham skyline at night with a signal beam">
<defs><style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes wf{0%,100%{opacity:.15}8%{opacity:.95}40%{opacity:.95}46%{opacity:.1}70%{opacity:.7}}
.w{fill:#F2B705;opacity:.15;animation:wf 7s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.45}50%{opacity:.8}}
.beam{animation:beam 6s ease-in-out infinite}
@keyframes drift{0%{transform:translateX(-60px)}100%{transform:translateX(60px)}}
.f1{animation:drift 22s ease-in-out infinite alternate}
.f2{animation:drift 31s ease-in-out infinite alternate-reverse}
@keyframes bat{0%{transform:translate(-60px,70px) scale(.7);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translate(960px,10px) scale(1.1);opacity:0}}
.bat{animation:bat 14s linear infinite}
@keyframes cloud{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
.cl{animation:cloud 18s ease-in-out infinite alternate}
</style>
